services:
  jobradar:
    build: .
    ports:
      - "127.0.0.1:${JOBRADAR_PORT:-8080}:8080"
    volumes:
      - jobradar-data:/data
    environment:
      JOBRADAR_DATA_DIR: /data
      JOBRADAR_SCAN_ENABLED: "${JOBRADAR_SCAN_ENABLED:-true}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  jobradar-data:
