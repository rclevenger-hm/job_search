{% extends 'base.html' %}{% block content %}<h1>Record application</h1><form class="panel" method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="key" value="{{ record.key }}">
<label>Job title<input name="title" value="{{ record.title }}" required></label><label>Company<input name="company" value="{{ record.company }}" required></label><label>Application link (optional)<input name="url" type="url" value="{{ record.url }}" placeholder="https://…"></label><label>Date applied<input name="applied_on" type="date" value="{{ record.applied_on }}" id="application-date"></label><label>Stage<select name="stage">{% for stage in ['Applied','Interviewing','Offer','Rejected','Withdrawn'] %}<option {% if stage == record.stage %}selected{% endif %}>{{ stage }}</option>{% endfor %}</select></label><label>Notes<textarea name="notes" rows="5">{{ record.notes }}</textarea></label><button>Save application</button></form>{% endblock %}
